name: Build Bridge 0.8.4 one-click Community handoff

on:
  push:
    branches: [recover-jksh-bridge-073]
    paths:
      - .github/workflows/build-jkssb-084-community-oneclick.yml
      - scripts/build_jkssb_084_community_oneclick.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-jksh-bridge-073
      - name: Verify Bridge 0.8.3 base
        shell: bash
        run: |
          set -euo pipefail
          ZIP=dist/jk-social-supabase-bridge-v0.8.3.zip
          test -f "$ZIP"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '1c19bc1f280874015ff3a7628e9dee7a1a7552df022f662212e694f3bfdb7845'
          test "$(stat -c%s "$ZIP")" = '47766'
          rm -rf /tmp/jkssb084 && mkdir -p /tmp/jkssb084
          unzip -q "$ZIP" -d /tmp/jkssb084

      - name: Apply Community one-click patch
        run: python3 scripts/build_jkssb_084_community_oneclick.py /tmp/jkssb084/jk-social-supabase-bridge

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          PHP=/tmp/jkssb084/jk-social-supabase-bridge/jk-social-supabase-bridge.php
          php -l "$PHP"
          grep -q 'Version: 0.8.4' "$PHP"
          grep -q 'Prepare media + open YouTube' "$PHP"
          grep -q 'await download(b.dataset.job)' "$PHP"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/jkssb084
          zip -qr /tmp/jk-social-supabase-bridge-v0.8.4.zip jk-social-supabase-bridge
          unzip -t /tmp/jk-social-supabase-bridge-v0.8.4.zip
          mkdir -p "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/reports"
          cp /tmp/jk-social-supabase-bridge-v0.8.4.zip "$GITHUB_WORKSPACE/dist/"
          SHA="$(sha256sum /tmp/jk-social-supabase-bridge-v0.8.4.zip | awk '{print $1}')"
          SIZE="$(stat -c%s /tmp/jk-social-supabase-bridge-v0.8.4.zip)"
          printf '%s\n' 'JK Social Supabase Bridge v0.8.4' "sha256=$SHA" "bytes=$SIZE" 'base_version=0.8.3' 'feature=one click copies Community post text, prepares media downloads, then opens YouTube' > "$GITHUB_WORKSPACE/reports/jkssb-084-community-manifest.txt"

      - name: Commit distributable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JK Social Maintenance Bot'
          git config user.email 'justkalinga@gmail.com'
          git add dist/jk-social-supabase-bridge-v0.8.4.zip reports/jkssb-084-community-manifest.txt
          if git diff --cached --quiet; then
            echo 'Bridge 0.8.4 already current.'
          else
            git commit -m 'Build Bridge 0.8.4 one-click Community handoff'
            git push origin HEAD:recover-jksh-bridge-073
          fi
