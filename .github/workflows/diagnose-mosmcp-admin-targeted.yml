name: Target miniOrange admin renderer crash

on:
  push:
    branches:
      - recover-jksh-bridge-073
    paths:
      - .github/workflows/diagnose-mosmcp-admin-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download miniOrange
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://downloads.wordpress.org/plugin/miniorange-secure-mcp-server.1.4.12.zip' -o /tmp/mosmcp.zip
          mkdir -p /tmp/mosmcp
          unzip -q /tmp/mosmcp.zip -d /tmp/mosmcp
      - name: Trace bootstrap callees
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/mosmcp/miniorange-secure-mcp-server')
          needles=['function connection_summary','connection_summary(', 'DOWNLOAD_NONCE_ACTION', 'function issuer_url', 'function resource_url']
          for p in root.rglob('*.php'):
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              for i,line in enumerate(lines,1):
                  if any(n in line for n in needles):
                      a=max(1,i-20); b=min(len(lines),i+90)
                      print(f'===== {p.relative_to(root)} {a}-{b} =====')
                      for n in range(a,b+1): print(f'{n}: {lines[n-1]}')
          PY
