name: Target miniOrange admin renderer crash

on:
  push:
    branches:
      - recover-jksh-bridge-073
    paths:
      - .github/workflows/diagnose-mosmcp-admin-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download miniOrange
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://downloads.wordpress.org/plugin/miniorange-secure-mcp-server.1.4.12.zip' -o /tmp/mosmcp.zip
          mkdir -p /tmp/mosmcp
          unzip -q /tmp/mosmcp.zip -d /tmp/mosmcp
      - name: Print dormant provider and bootstrap tail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/mosmcp/miniorange-secure-mcp-server')
          for rel in ['includes/common/views/admin/class-dormant-abilities-provider.php','includes/common/views/admin/class-admin-app.php']:
              p=root/rel
              lines=p.read_text(errors='replace').splitlines()
              print('===== '+rel+' =====')
              start=1 if 'dormant' in rel else 240
              end=len(lines) if 'dormant' in rel else min(len(lines),280)
              for n in range(start,end+1): print(f'{n}: {lines[n-1]}')
          PY
