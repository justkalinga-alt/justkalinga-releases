name: Target miniOrange admin renderer crash

on:
  push:
    branches:
      - recover-jksh-bridge-073
    paths:
      - .github/workflows/diagnose-mosmcp-admin-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download miniOrange
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://downloads.wordpress.org/plugin/miniorange-secure-mcp-server.1.4.12.zip' -o /tmp/mosmcp.zip
          mkdir -p /tmp/mosmcp
          unzip -q /tmp/mosmcp.zip -d /tmp/mosmcp
      - name: Verify Dormant Abilities Provider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/mosmcp/miniorange-secure-mcp-server')
          needle='Dormant_Abilities_Provider'
          found=[]
          for p in root.rglob('*.php'):
              try: lines=p.read_text(errors='replace').splitlines()
              except: continue
              for i,line in enumerate(lines,1):
                  if needle in line:
                      found.append((p.relative_to(root),i,line.strip()))
          print('DORMANT_REFERENCES',len(found))
          for p,i,line in found: print(f'{p}:{i}: {line}')
          print('===== ADMIN IMPORTS =====')
          p=root/'includes/common/views/admin/class-admin-app.php'
          for i,line in enumerate(p.read_text(errors='replace').splitlines()[:40],1): print(f'{i}: {line}')
          print('===== PROVIDER-LIKE FILES =====')
          for p in root.rglob('*dormant*'):
              print(p.relative_to(root))
          for p in root.rglob('*provider*.php'):
              print(p.relative_to(root))
          print('===== AUTOLOAD =====')
          for p in root.rglob('*.php'):
              try: t=p.read_text(errors='replace')
              except: continue
              if 'spl_autoload_register' in t or 'autoload' in p.name.lower() or 'classmap' in t.lower():
                  print(p.relative_to(root))
          PY
