name: Inspect live Bridge Composer admin footer

on:
  push:
    branches:
      - recover-jksh-bridge-073
    paths:
      - .github/workflows/diagnose-mosmcp-admin-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact live Bridge and inspect injector
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://social-justkalinga.tempurl.host/wp-content/uploads/2026/09/jk-social-supabase-bridge-v0.7.3.zip' -o /tmp/base.zip
          rm -rf /tmp/jkssb && mkdir -p /tmp/jkssb
          unzip -q /tmp/base.zip -d /tmp/jkssb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/jkssb/jk-social-supabase-bridge/jk-social-supabase-bridge.php')
          lines=p.read_text(errors='replace').splitlines()
          needle='function inject_composer_upload_ui'
          hit=None
          for i,line in enumerate(lines,1):
              if needle in line:
                  hit=i
                  break
          print('TOTAL_LINES',len(lines))
          print('INJECTOR_LINE',hit)
          if not hit:
              raise SystemExit('inject_composer_upload_ui not found')
          start=max(1,hit-25)
          end=min(len(lines),hit+180)
          for n in range(start,end+1):
              print(f'{n}: {lines[n-1]}')
          PY
