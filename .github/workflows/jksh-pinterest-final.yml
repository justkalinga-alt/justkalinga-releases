name: Build JKSH Pinterest Sandbox render-order fix

on:
  push:
    branches:
      - jksh-pinterest-fix-20260920
    paths:
      - .github/workflows/jksh-pinterest-final.yml
      - scripts/patch_v01311.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jksh-pinterest-fix-20260920

      - name: Fetch verified v0.13.10 base
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://raw.githubusercontent.com/justkalinga-alt/justkalinga-releases/jksh-pinterest-fix-20260920/jk-social-hub-v0.13.10.zip' -o base.zip
          echo '95211b9d8747117942e5aea693f594f40ccf826a2ba4cb0ad7101868ff6dfe2a  base.zip' | sha256sum -c -
          rm -rf build
          mkdir build
          unzip -q base.zip -d build

      - name: Apply render-order patch
        run: python3 scripts/patch_v01311.py

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          find build/jk-social-hub -name '*.php' -print0 | xargs -0 -n1 php -l > php-lint-v01311.txt
          grep -q 'No syntax errors detected' php-lint-v01311.txt
          rm -f jk-social-hub-v0.13.11.zip jk-social-hub-v0.13.11.zip.sha256
          (cd build && zip -qr ../jk-social-hub-v0.13.11.zip jk-social-hub)
          sha256sum jk-social-hub-v0.13.11.zip | tee jk-social-hub-v0.13.11.zip.sha256
          unzip -t jk-social-hub-v0.13.11.zip > zip-test-v01311.txt
          grep -q 'No errors detected' zip-test-v01311.txt

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JK Social Build Bot'
          git config user.email 'justkalinga@gmail.com'
          git add jk-social-hub-v0.13.11.zip jk-social-hub-v0.13.11.zip.sha256 php-lint-v01311.txt zip-test-v01311.txt
          git commit -m 'Build JK Social Hub v0.13.11 Pinterest Sandbox render-order fix [skip ci]' || true
          git push origin HEAD:jksh-pinterest-fix-20260920
