name: Build JKSH Pinterest Sandbox callback fix

on:
  push:
    branches:
      - jksh-pinterest-fix-20260920
    paths:
      - .github/workflows/jksh-pinterest-final.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jksh-pinterest-fix-20260920

      - name: Fetch verified v0.13.8 base
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://raw.githubusercontent.com/justkalinga-alt/justkalinga-releases/jksh-pinterest-fix-20260920/jk-social-hub-v0.13.8.zip' -o base.zip
          echo 'fedbef136f99ae3c81641b2beaff42dac644942f8695fc452e731d7e1e42695c  base.zip' | sha256sum -c -
          rm -rf build && mkdir build
          unzip -q base.zip -d build

      - name: Patch callback visibility and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('build/jk-social-hub')
          main = root / 'jk-social-hub.php'
          sandbox = root / 'includes/class-jksh-pinterest-sandbox-v0138.php'

          s = main.read_text()
          pairs = [
            (" * Version:     0.13.8", " * Version:     0.13.9"),
            ("define( 'JKSH_VERSION', '0.13.8' );", "define( 'JKSH_VERSION', '0.13.9' );"),
            (
              " * Description: Internal social-media operating system for JustKalinga. v0.13.8 adds a secure Pinterest Sandbox proof lane with encrypted token storage and Sandbox Published receipts.",
              " * Description: Internal social-media operating system for JustKalinga. v0.13.9 fixes Pinterest Sandbox REST permission callbacks while preserving the encrypted proof lane."
            ),
          ]
          for old,new in pairs:
              if old not in s:
                  raise SystemExit(f'Missing main pattern: {old}')
              s=s.replace(old,new,1)
          main.write_text(s)

          s = sandbox.read_text()
          old = "private function can_manage() {"
          new = "public function can_manage() {"
          if old not in s:
              raise SystemExit('Missing can_manage visibility pattern')
          s=s.replace(old,new,1)
          sandbox.write_text(s)
          PY

      - name: Validate PHP and package
        shell: bash
        run: |
          set -euo pipefail
          find build/jk-social-hub -name '*.php' -print0 | xargs -0 -n1 php -l > php-lint-v0139.txt
          grep -q 'No syntax errors detected' php-lint-v0139.txt
          rm -f jk-social-hub-v0.13.9.zip jk-social-hub-v0.13.9.zip.sha256
          (cd build && zip -qr ../jk-social-hub-v0.13.9.zip jk-social-hub)
          sha256sum jk-social-hub-v0.13.9.zip | tee jk-social-hub-v0.13.9.zip.sha256
          unzip -t jk-social-hub-v0.13.9.zip > zip-test-v0139.txt
          grep -q 'No errors detected' zip-test-v0139.txt

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JK Social Build Bot'
          git config user.email 'justkalinga@gmail.com'
          git add jk-social-hub-v0.13.9.zip jk-social-hub-v0.13.9.zip.sha256 php-lint-v0139.txt zip-test-v0139.txt
          git commit -m 'Build JK Social Hub v0.13.9 Sandbox callback fix [skip ci]'
          git push origin HEAD:jksh-pinterest-fix-20260920
