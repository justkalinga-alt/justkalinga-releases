name: Diagnose miniOrange admin crash

on:
  push:
    branches:
      - recover-jksh-bridge-073
    paths:
      - .github/workflows/diagnose-mosmcp-admin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 'https://social-justkalinga.tempurl.host/wp-content/uploads/2026/09/jk-social-supabase-bridge-v0.7.3.zip' -o /tmp/bridge.zip
          mkdir -p /tmp/bridge
          unzip -q /tmp/bridge.zip -d /tmp/bridge
      - name: Print composer injector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/bridge').rglob('jk-social-supabase-bridge.php'))
          lines=p.read_text(errors='replace').splitlines()
          targets=['function inject_composer_upload_ui','inject_composer_upload_ui(', 'get_current_screen', 'jksh-composer']
          seen=set()
          for i,line in enumerate(lines,1):
              if any(t in line for t in targets):
                  a=max(1,i-35); b=min(len(lines),i+140)
                  key=(a,b)
                  if key in seen: continue
                  seen.add(key)
                  print(f'===== {a}-{b} =====')
                  for n in range(a,b+1): print(f'{n}: {lines[n-1]}')
          PY
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          php -l /tmp/bridge/jk-social-supabase-bridge/jk-social-supabase-bridge.php
