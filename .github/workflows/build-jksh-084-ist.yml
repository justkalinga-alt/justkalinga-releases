name: Build JK Social Hub 0.8.4 IST

on:
  push:
    branches: [recover-jksh-bridge-073]
    paths:
      - .github/workflows/build-jksh-084-ist.yml
      - scripts/build_jksh_084_ist.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-jksh-bridge-073
      - name: Fetch and verify exact live 0.8.3 export
        shell: bash
        run: |
          set -euo pipefail
          URL='https://social-justkalinga.tempurl.host/wp-content/uploads/2026/09/jk-social-hub-live-v0.8.3-export.zip'
          EXPECT='89ebebfa96a169d5ee8d46ee1456255da880f7aea0f93ff1dd9abe6ce9f4e202'
          curl -fL --retry 4 --retry-all-errors "$URL" -o /tmp/jksh083.zip
          test "$(sha256sum /tmp/jksh083.zip | awk '{print $1}')" = "$EXPECT"
          rm -rf /tmp/jksh084 && mkdir -p /tmp/jksh084
          unzip -q /tmp/jksh083.zip -d /tmp/jksh084
          test -f /tmp/jksh084/jk-social-hub/jk-social-hub.php
          grep -q 'Version:     0.8.3' /tmp/jksh084/jk-social-hub/jk-social-hub.php
      - name: Apply IST patch
        run: python3 scripts/build_jksh_084_ist.py /tmp/jksh084/jk-social-hub
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/jksh084/jk-social-hub
          grep -q 'Version:     0.8.4' "$ROOT/jk-social-hub.php"
          grep -q "define( 'JKSH_VERSION', '0.8.4' );" "$ROOT/jk-social-hub.php"
          grep -q 'Publish IST' "$ROOT/src/Admin/Pages.php"
          grep -q 'Scheduled IST' "$ROOT/src/Admin/Pages.php"
          grep -q 'Time IST' "$ROOT/src/Admin/Pages.php"
          grep -q 'Created IST' "$ROOT/src/Admin/Pages.php"
          grep -q 'Token expiry IST' "$ROOT/src/Admin/Pages.php"
          grep -q 'scheduled_at_ist' "$ROOT/src/Mcp/Abilities.php"
          if grep -qE 'Publish UTC|Scheduled UTC|Time UTC|Created UTC|Token expiry UTC|Last checked UTC' "$ROOT/src/Admin/Pages.php"; then
            echo 'A human-facing UTC label remains in Pages.php' >&2
            exit 1
          fi
          find "$ROOT" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package 0.8.4
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/jk-social-hub-v0.8.4-ist.zip
          cd /tmp/jksh084
          zip -qr /tmp/jk-social-hub-v0.8.4-ist.zip jk-social-hub
          unzip -t /tmp/jk-social-hub-v0.8.4-ist.zip
          mkdir -p "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/reports"
          cp /tmp/jk-social-hub-v0.8.4-ist.zip "$GITHUB_WORKSPACE/dist/jk-social-hub-v0.8.4-ist.zip"
          SHA="$(sha256sum /tmp/jk-social-hub-v0.8.4-ist.zip | awk '{print $1}')"
          SIZE="$(stat -c%s /tmp/jk-social-hub-v0.8.4-ist.zip)"
          printf '%s\n' \
            'JK Social Hub v0.8.4 IST' \
            "sha256=$SHA" \
            "bytes=$SIZE" \
            'base_live_version=0.8.3' \
            'base_export_sha256=89ebebfa96a169d5ee8d46ee1456255da880f7aea0f93ff1dd9abe6ce9f4e202' \
            'human_timezone=Asia/Kolkata (IST)' \
            'internal_storage=UTC where required by queue/platform contracts' \
            > "$GITHUB_WORKSPACE/reports/jksh-084-ist-manifest.txt"
      - name: Commit distributable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JK Social Maintenance Bot'
          git config user.email 'justkalinga@gmail.com'
          git add dist/jk-social-hub-v0.8.4-ist.zip reports/jksh-084-ist-manifest.txt
          if git diff --cached --quiet; then
            echo '0.8.4 package already current.'
          else
            git commit -m 'Build JK Social Hub 0.8.4 IST'
            git push origin HEAD:recover-jksh-bridge-073
          fi
